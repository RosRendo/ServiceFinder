name: Backend NestJS CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend-nest/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend-nest/**'

defaults:
  run:
    working-directory: ./backend-nest

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './backend-nest/package-lock.json'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Linter
        run: npm run lint

      - name: Run Tests with Coverage
        run: npm run test:cov

  deploy-production:
    name: Deploy to Production (VPS)
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Navigate to the project directory on the VPS
          script: |
            cd /var/www/Service_Finder/backend-nest
            git pull origin main
            npm ci --legacy-peer-deps
            # Force resolve the broken migration from Jun 20th so Prisma stops crashing
            npx prisma migrate resolve --applied 20260608060916_latest || true
            npx prisma migrate deploy || echo "Migration deploy failed but continuing"
            # Use ecosystem config for zero-downtime reloads
            pm2 start ecosystem.config.js || pm2 reload service-finder-api
