name: Backend NestJS CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend-nest/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend-nest/**'

defaults:
  run:
    working-directory: ./backend-nest

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './backend-nest/package-lock.json'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Dependency Scan (npm audit)
        run: npm audit --audit-level=high
        continue-on-error: true


      - name: Run Linter
        run: npm run lint

      - name: Run Tests with Coverage
        run: npm run test:cov

      - name: Start Database and Cache
        run: docker compose up -d postgres-db redis
        working-directory: ./

      - name: Wait for PostgreSQL
        run: npx wait-on tcp:127.0.0.1:5432

      - name: Run Migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "postgresql://root:local_dev_password@127.0.0.1:5432/servicefinder"

      - name: Build Backend
        run: npm run build

      - name: Start Backend in Background
        run: npm run start:prod &
        env:
          DATABASE_URL: "postgresql://root:local_dev_password@127.0.0.1:5432/servicefinder"
          REDIS_URL: "redis://127.0.0.1:6379"
          JWT_SECRET: "ci_pipeline_secret_test"
          PORT: 5000

      - name: Wait for API to start
        run: npx wait-on http://127.0.0.1:5000/api/health

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman Tests (Newman)
        run: newman run ../tests/postman_collection.json
        continue-on-error: true

      - name: SonarQube Scan (SAST)
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: backend-nest
        continue-on-error: true

      - name: OWASP ZAP Baseline Scan (DAST)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:5000' # Update this to your staging URL if applicable
          fail_action: false # Set to true to break the build on high alerts
        continue-on-error: true

  build-and-push:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend-nest
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}/backend-nest:${{ github.sha }}
            ghcr.io/${{ env.REPO_LC }}/backend-nest:latest

  deploy-production:
    name: Deploy to Production (VPS)
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Lowercase repository name
        working-directory: .
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          REPO_LC: ${{ env.REPO_LC }}
          GITHUB_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR,REPO_LC,GITHUB_SHA
          script: |
            # 1. Log in to GHCR on the VPS
            echo "$GITHUB_TOKEN" | sudo docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            
            # 2. Go to project and update docker-compose.yml
            cd ~/Service_Finder
            git pull origin main
            
            # 3. Clean up old PM2 processes if they exist
            pm2 stop service-finder-api || true
            pm2 delete service-finder-api || true
            
            # 4. Pull the pre-built versioned image
            sudo TAG=$GITHUB_SHA docker-compose pull backend
            
            # 5. Start the backend with the new image tag (Migrations auto-run on container boot)
            sudo TAG=$GITHUB_SHA docker-compose up -d backend
