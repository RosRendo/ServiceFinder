<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Outer Ribbon Gradient (Cobalt -> Electric Cyan) -->
    <linearGradient id="sf-pin-ribbon" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="45%" stop-color="#2563EB" />
      <stop offset="80%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>

    <!-- Inner Shading Ribbon -->
    <linearGradient id="sf-pin-inner" x1="30%" y1="20%" x2="90%" y2="85%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="60%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Solar Core Beacon (Warm Coral / Amber) -->
    <radialGradient id="sf-solar-beacon" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FDBA74" />
      <stop offset="50%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </radialGradient>

    <!-- Discovery Spark Gradient -->
    <linearGradient id="sf-spark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Drop Shadow Filter for Glow -->
    <filter id="sf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284C7" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Dynamic Upward Discovery Sparks (Top Right) -->
  <path d="M68 24 L75 8 L71 21 Z" fill="url(#sf-spark-grad)" />
  <path d="M74 27 L88 18 L76 25 Z" fill="url(#sf-spark-grad)" />
  <path d="M72 32 L85 30 L74 34 Z" fill="#06B6D4" />

  <!-- Main Map Marker Ribbon Loop -->
  <g filter="url(#sf-glow)">
    <!-- Outer Teardrop Body -->
    <path
      d="M48 88 
         C43 81 20 56 20 38 
         C20 22.5 32.5 10 48 10 
         C59 10 68 16 71 25
         C69 25 64 26 62 29
         C58.5 24 53.5 21 48 21
         C38.6 21 31 28.6 31 38
         C31 51 44 69 48 76
         C52 69 65 51 65 38
         C65 36 64.7 34 64.2 32.2
         C67.5 30.5 70.8 33 71.5 35
         C73.5 39 74 44 72 49
         C68 62 53 81 48 88 Z"
      fill="url(#sf-pin-ribbon)"
    />

    <!-- Inner Fluid Contour Accent (Cyan / Aqua) -->
    <path
      d="M48 88
         C53 81 68 62 72 49
         C69 56 61 70 48 82
         C35 70 27 56 24 49
         C22 55 35 73 48 88 Z"
      fill="url(#sf-pin-inner)"
      opacity="0.9"
    />
  </g>

  <!-- Central Solar Core Beacon -->
  <circle cx="48" cy="38" r="10.5" fill="url(#sf-solar-beacon)" />
</svg>
