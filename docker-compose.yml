
services:

  backend:
    build:
      context: ./backend-nest
      dockerfile: Dockerfile
    image: rosrendo/servicefinder-backend:${TAG:-latest}
    container_name: service-finder-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend-nest/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL:-postgresql://root:local_dev_password@postgres-db:5432/servicefinder}
      REDIS_URL: redis://redis:6379
    networks:
      - service-finder-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_started

  postgres-db:
    image: postgres:15-alpine
    container_name: service-finder-db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_dev_password}
      POSTGRES_DB: servicefinder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - service-finder-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d servicefinder"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: service-finder-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - service-finder-net
    restart: unless-stopped

