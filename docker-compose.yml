
services:
  nginx:
    image: nginx:alpine
    container_name: service-finder-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - service-finder-net
    restart: unless-stopped

  backend:
    build:
      context: ./backend-nest
      dockerfile: Dockerfile
    image: rosrendo/servicefinder-backend:${TAG:-latest}
    container_name: service-finder-backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL:-mysql://root:local_dev_password@mysql-db:3306/servicefinder}
      REDIS_URL: redis://redis:6379
    networks:
      - service-finder-net
    restart: unless-stopped
    depends_on:
      - mysql-db
      - redis

  mysql-db:
    image: mariadb:10.11
    container_name: service-finder-db
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-local_dev_password}
      MYSQL_DATABASE: servicefinder
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - service-finder-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-local_dev_password}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: service-finder-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - service-finder-net
    restart: unless-stopped

