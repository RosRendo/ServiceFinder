apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: production
type: Opaque
data:
  secret: c3VwZXItc2VjcmV0LWtleS0xMjM0NQ== # super-secret-key-12345
---
apiVersion: v1
kind: Secret
metadata:
  name: smtp-secret
  namespace: production
type: Opaque
data:
  user: dGVzdHVzZXI= # testuser
  pass: dGVzdHBhc3M= # testpass
---
