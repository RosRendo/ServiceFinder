# ============================================================
# Nginx Ingress — API Gateway for all microservices
# All traffic enters through port 80 → routed to services
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: servicefinder-api-gateway
  namespace: production
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.servicefinder.com
      secretName: api-tls
  rules:
    - host: api.servicefinder.com
      http:
        paths:
          # ── Auth & Users ──────────────────────────────────
          - path: /api/(auth|users)(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: auth-service
                port:
                  number: 3001

          # ── Companies, Categories, Services ───────────────
          - path: /api/(companies|categories|service-types|services)(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: company-service
                port:
                  number: 3004

          # ── Bookings ──────────────────────────────────────
          - path: /api/(bookings)(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: booking-service
                port:
                  number: 3003

          # ── Payments ──────────────────────────────────────
          - path: /api/(payments)(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: payment-service
                port:
                  number: 3002

          # ── Reviews & Saved Items ─────────────────────────
          - path: /api/(reviews|saved-items)(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: review-service
                port:
                  number: 3006

          # ── Notifications ─────────────────────────────────
          - path: /api/(notifications)(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: notification-service
                port:
                  number: 3005

---
# ============================================================
# ConfigMap — shared non-secret app config
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: production
data:
  frontend-url: "https://servicefinder.com"
  node-env: "production"

---
# ============================================================
# Namespace definitions
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: production
---
apiVersion: v1
kind: Namespace
metadata:
  name: staging
