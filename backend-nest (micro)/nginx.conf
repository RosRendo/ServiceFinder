events {
  worker_connections 1024;
}

http {
  upstream auth_service      { server auth-service:3001; }
  upstream company_service   { server company-service:3004; }
  upstream booking_service   { server booking-service:3003; }
  upstream payment_service   { server payment-service:3002; }
  upstream review_service    { server review-service:3006; }
  upstream notification_svc  { server notification-service:3005; }

  server {
    listen 80;

    # ── Auth ─────────────────────────────────────────────────
    location /api/auth {
      proxy_pass http://auth_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/users {
      proxy_pass http://auth_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Companies / Categories / Services ────────────────────
    location /api/companies {
      proxy_pass http://company_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/categories {
      proxy_pass http://company_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/service-types {
      proxy_pass http://company_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/services {
      proxy_pass http://company_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Bookings ─────────────────────────────────────────────
    location /api/bookings {
      proxy_pass http://booking_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Payments ─────────────────────────────────────────────
    location /api/payments {
      proxy_pass http://payment_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Reviews & Saved Items ─────────────────────────────────
    location /api/reviews {
      proxy_pass http://review_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/saved-items {
      proxy_pass http://review_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Notifications ─────────────────────────────────────────
    location /api/notifications {
      proxy_pass http://notification_svc;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
